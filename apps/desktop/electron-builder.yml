appId: app.easyvoice.desktop
productName: EasyVoice
directories:
  output: release
files:
  - dist/**
  - dist-electron/**
  - package.json
win:
  target: nsis
mac:
  target: dmg
  category: public.app-category.music
  extendInfo:
    NSMicrophoneUsageDescription: EasyVoice dùng micro để thu giọng mẫu và đổi giọng trực tiếp.
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
