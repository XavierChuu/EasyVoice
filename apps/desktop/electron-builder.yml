appId: app.easyvoice.desktop
productName: EasyVoice
directories:
  output: release
files:
  - dist/**
  - dist-electron/**
  - package.json
# Module native (hook bàn phím toàn cục cho phím tắt live) không chạy được từ trong asar.
asarUnpack:
  - node_modules/uiohook-napi/**
win:
  target: nsis
mac:
  target: dmg
  category: public.app-category.music
  extendInfo:
    NSMicrophoneUsageDescription: EasyVoice dùng micro để thu giọng mẫu và đổi giọng trực tiếp.
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
